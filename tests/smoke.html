<!doctype html>
<html lang="en" data-theme="sticky">
<head>
  <meta charset="utf-8">
  <title>smoke</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    window.__errors = [];
    window.addEventListener('error', function (e) { window.__errors.push(e.message || String(e)); });
    window.addEventListener('unhandledrejection', function (e) { window.__errors.push('promise: ' + e.reason); });
  </script>
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="topbar-left">
        <span class="logo" aria-hidden="true"></span>
        <input id="board-name" type="text" class="board-name" maxlength="120" placeholder="Board name" aria-label="Board name" spellcheck="false">
        <span id="stats" class="stats" aria-live="polite"></span>
      </div>
      <div class="search-box" role="search">
        <input id="search" type="text" placeholder="Search cards   /" aria-label="Search cards" spellcheck="false">
        <button id="search-clear" class="icon-btn" type="button" aria-label="Clear search" style="display:none"></button>
      </div>
      <div class="topbar-right">
        <button id="btn-add-list" class="btn" type="button">+ Add list</button>
        <span class="theme-wrap">
          <button id="btn-theme" class="icon-btn" type="button" aria-label="Choose theme"></button>
          <div id="theme-picker" class="theme-picker" hidden role="group" aria-label="Board themes">
            <p class="theme-picker-title">Theme</p>
            <button type="button" class="theme-option" data-theme-name="sticky" aria-pressed="false"><span class="theme-dots"></span>Sticky notes</button>
            <button type="button" class="theme-option" data-theme-name="blueprint" aria-pressed="false"><span class="theme-dots"></span>Blueprint</button>
            <button type="button" class="theme-option" data-theme-name="cyberpunk" aria-pressed="false"><span class="theme-dots"></span>Cyberpunk</button>
            <button type="button" class="theme-option" data-theme-name="claude" aria-pressed="false"><span class="theme-dots"></span>Claude</button>
            <button type="button" class="theme-option" data-theme-name="ios-glass" aria-pressed="false"><span class="theme-dots"></span>iOS Glass</button>
            <button type="button" class="theme-option" data-theme-name="swiss" aria-pressed="false"><span class="theme-dots"></span>Swiss</button>
            <button type="button" class="theme-option" data-theme-name="forest" aria-pressed="false"><span class="theme-dots"></span>Forest</button>
          </div>
        </span>
        <button id="btn-file" class="icon-btn" type="button" aria-label="Board file"></button>
        <button id="btn-export" class="icon-btn" type="button" aria-label="Export board"></button>
        <button id="btn-import" class="icon-btn" type="button" aria-label="Import board"></button>
        <button id="btn-reset" class="icon-btn" type="button" aria-label="Reset board"></button>
        <button id="btn-help" class="icon-btn help-btn" type="button" aria-label="Help">?</button>
      </div>
    </header>

    <main id="board" class="board" aria-label="Kanban board">
      <div id="columns" class="columns"></div>
    </main>

  </div>

  <div id="card-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel card-panel" role="dialog" aria-modal="true" aria-label="Card details">
      <div class="modal-head">
        <input id="cm-title" type="text" class="cm-title" placeholder="Card title" maxlength="300" aria-label="Card title">
        <button id="cm-close" class="icon-btn" type="button" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <textarea id="cm-desc" rows="4" placeholder="Add a description…" aria-label="Description"></textarea>
        <div class="cm-grid">
          <label class="cm-field"><span>Priority</span>
            <select id="cm-priority"><option value="0">Low</option><option value="1" selected>Medium</option><option value="2">High</option><option value="3">Urgent</option></select>
          </label>
          <label class="cm-field"><span>Due date</span><input id="cm-due" type="date" aria-label="Due date"></label>
          <label class="cm-field"><span>Assignee</span><input id="cm-assignee" type="text" placeholder="Who's on it?" maxlength="60" aria-label="Assignee"></label>
        </div>
        <section class="cm-section">
          <h4>Labels</h4>
          <div id="cm-labels" class="cm-labels"></div>
          <div class="cm-row-input">
            <input id="cm-new-label-name" type="text" placeholder="New label name" maxlength="40" aria-label="New label name">
            <input id="cm-new-label-color" type="color" value="#3e63dd" title="Label color" aria-label="Label color">
            <button id="cm-add-label" class="btn" type="button">Add</button>
          </div>
        </section>
        <section class="cm-section">
          <h4>Checklist <span id="cm-progress-text" class="cm-progress-text"></span></h4>
          <div id="cm-progress-bar" class="cm-progress-bar"><span></span></div>
          <ul id="cm-checklist" class="cm-checklist"></ul>
          <div class="cm-row-input">
            <input id="cm-new-item" type="text" placeholder="Add an item" maxlength="300" aria-label="New checklist item">
            <button id="cm-add-item" class="btn" type="button">Add</button>
          </div>
        </section>
      </div>
      <div class="modal-foot">
        <span id="cm-meta" class="cm-meta"></span>
        <button id="cm-delete" class="btn danger" type="button">Delete card</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel confirm-panel" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn" type="button">Cancel</button>
        <button id="confirm-yes" class="btn danger" type="button">Yes, do it</button>
      </div>
    </div>
  </div>

  <div id="help-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-help></div>
    <div class="modal-panel help-panel" role="dialog" aria-modal="true" aria-label="Shortcuts and help">
      <div class="modal-head"><h3>Shortcuts &amp; help</h3><button class="icon-btn" type="button" data-close-help aria-label="Close"></button></div>
      <div class="modal-body"><dl class="help-list"><dt>/</dt><dd>Focus search</dd></dl></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-action" class="toast-action" type="button" hidden></button>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <input type="file" id="board-file-input" accept=".json,application/json" hidden>

  <pre id="report" style="white-space:pre-wrap;padding:16px;font-family:monospace"></pre>

  <script src="../vendor/Sortable.min.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/app.js"></script>
  <script>
    (function () {
      var results = [];

      function ok(name, cond, extra) {
        results.push((cond ? 'PASS' : 'FAIL') + '  ' + name + (extra ? '  [' + extra + ']' : ''));
      }

      function $(id) { return document.getElementById(id); }
      function bySel(sel) { return document.querySelector(sel); }
      function bySelAll(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
      function fire(el, type, opts) {
        var Ev = (type === 'keydown' || type === 'keyup') ? KeyboardEvent : Event;
        el.dispatchEvent(new Ev(type, Object.assign({ bubbles: true, cancelable: true }, opts || {})));
      }
      function columnCards(colEl) { return Array.prototype.slice.call(colEl.querySelectorAll('.card')); }
      function columnWithTitle(title) {
        var cols = bySelAll('.column');
        for (var i = 0; i < cols.length; i++) {
          var h = cols[i].querySelector('.column-title');
          if (h && h.textContent === title) return cols[i];
        }
        return null;
      }

      // Minimal in-memory stand-in for the IndexedDB API surface app.js uses.
      function installFakeIDB(seed) {
        var data = {};
        Object.keys(seed || {}).forEach(function (k) { data[k] = seed[k]; });
        function makeReq() { return { onsuccess: null, onerror: null, result: undefined }; }
        var db = {
          close: function () {},
          transaction: function () {
            var tx = {
              objectStore: function () {
                return {
                  get: function (key) {
                    var r = makeReq();
                    setTimeout(function () { r.result = data[key]; if (r.onsuccess) r.onsuccess(); }, 0);
                    return r;
                  },
                  put: function (value, key) {
                    data[key] = value;
                    setTimeout(function () { if (tx.oncomplete) tx.oncomplete(); }, 0);
                    return makeReq();
                  }
                };
              }
            };
            return tx;
          }
        };
        window.indexedDB = {
          open: function () {
            var r = makeReq();
            setTimeout(function () { r.result = db; if (r.onsuccess) r.onsuccess(); }, 0);
            return r;
          }
        };
      }

      // Stand-in for a FileSystemFileHandle pointing at a board JSON file.
      function makeFakeHandle(boardObj) {
        var text = JSON.stringify(boardObj);
        var handle = {
          queryPermission: function () { return Promise.resolve('granted'); },
          getFile: function () {
            return Promise.resolve({ size: text.length, text: function () { return Promise.resolve(text); } });
          },
          createWritable: function () {
            return {
              write: function (data) { handle.writes.push(data); return Promise.resolve(); },
              close: function () { return Promise.resolve(); }
            };
          },
          writes: []
        };
        return handle;
      }

      async function run() {
        try {
          // T1: initial render
          ok('T1 initial: 3 columns', bySelAll('.column').length === 3, bySelAll('.column').length);
          ok('T1 initial: 1 card', bySelAll('.card').length === 1, bySelAll('.card').length);
          ok('T1 initial: stats', $('stats').textContent === '1 card', $('stats').textContent);
          ok('T1 initial: welcome card', !!bySel('.card .card-title'));

          // T2: quick-add a card
          bySel('.column [data-action="quick-add"]').click();
          var qa = $('quick-add-text');
          ok('T2 quick-add composer visible', !!qa);
          if (qa) {
            qa.value = 'Smoke test card XYZ';
            fire(qa, 'input');
            fire(qa, 'keydown', { key: 'Enter' });
          }
          var firstCol = bySelAll('.column')[0];
          ok('T2 quick-add: card added', columnCards(firstCol).length === 2, columnCards(firstCol).length);
          ok('T2 quick-add: card visible', !!bySel('.card-title') && document.body.textContent.indexOf('Smoke test card XYZ') !== -1);

          // T3: add a list
          $('btn-add-list').click();
          var nl = $('new-list-name');
          ok('T3 list composer visible', !!nl);
          if (nl) {
            nl.value = 'Smoke list';
            fire(nl, 'keydown', { key: 'Enter' });
          }
          ok('T3 list added (4 columns)', bySelAll('.column').length === 4, bySelAll('.column').length);
          ok('T3 list titled', !!columnWithTitle('Smoke list'));

          // T4: open modal, edit, checklist
          var smokeCardEl = null;
          var cards = bySelAll('.card');
          for (var i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ') !== -1) smokeCardEl = cards[i];
          }
          ok('T4 smoke card found in DOM', !!smokeCardEl);
          if (smokeCardEl) smokeCardEl.click();
          ok('T4 modal open', !$('card-modal').hidden);
          // The app commits modal fields on live input/change events (app.js bindModal),
          // so simulate real user input by firing those events.
          $('cm-title').value = 'Smoke test card XYZ (renamed)';
          fire($('cm-title'), 'input');
          $('cm-desc').value = 'smoke description text';
          fire($('cm-desc'), 'input');
          $('cm-priority').value = '3';
          fire($('cm-priority'), 'change');
          $('cm-due').value = '2020-01-01';
          fire($('cm-due'), 'change');
          $('cm-assignee').value = 'tester';
          fire($('cm-assignee'), 'change');
          var ni = $('cm-new-item');
          ni.value = 'step one';
          fire(ni, 'keydown', { key: 'Enter' });
          ok('T4 checklist item added', bySelAll('#cm-checklist .cl-row').length === 1, bySelAll('#cm-checklist .cl-row').length);
          var cb = bySel('#cm-checklist input[type="checkbox"]');
          if (cb) cb.click();
          ok('T4 checklist item checked', !!bySel('#cm-checklist .cl-item.done'));
          // Edit the item inline: pencil button -> input -> Enter saves
          var editBtn = bySel('#cm-checklist [data-edit-item]');
          ok('T4 edit button present', !!editBtn);
          if (editBtn) {
            editBtn.click();
            var ei = bySel('#cm-checklist .cl-edit-input');
            ok('T4 edit input appears', !!ei);
            if (ei) {
              ei.value = 'step one (edited)';
              fire(ei, 'keydown', { key: 'Enter' });
            }
          }
          var editedSpan = bySel('#cm-checklist .cl-item span');
          ok('T4 item text updated', !!editedSpan && editedSpan.textContent === 'step one (edited)', editedSpan && editedSpan.textContent);
          $('cm-close').click();
          ok('T4 modal closed', $('card-modal').hidden);
          // Check the board DOM (not document.body.textContent — this test's own
          // script text lives in <body> and would make that check a false positive).
          var renamedInBoard = false;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) renamedInBoard = true;
          }
          ok('T4 title saved', renamedInBoard);

          // T5: overdue meta visible (due 2020)
          var renamedCard = null;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) renamedCard = cards[i];
          }
          ok('T5 overdue meta shown', renamedCard && !!renamedCard.querySelector('.meta.due.overdue'));

          // T12: checklist visible on board cards + in-place toggle
          var clCard = null;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) clCard = cards[i];
          }
          ok('T12a checklist visible on card', !!clCard && !!clCard.querySelector('.card-checklist'));
          var boardCb = clCard ? clCard.querySelector('.card-checklist input[type="checkbox"]') : null;
          ok('T12b item state mirrored (checked)', !!boardCb && boardCb.checked === true);
          if (boardCb) boardCb.click();
          var savedDone = null;
          try {
            var sb = JSON.parse(localStorage.getItem('kanban.board.v1'));
            for (var k in sb.cards) {
              if (sb.cards[k].title.indexOf('(renamed)') !== -1 && sb.cards[k].checklist.length) savedDone = sb.cards[k].checklist[0].done;
            }
          } catch (e) {}
          ok('T12c board toggle persists', savedDone === false, String(savedDone));
          clCard = null;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) clCard = cards[i];
          }
          ok('T12d count updated to 0/1', !!clCard && clCard.querySelector('.cl-count').textContent === '0/1');
          var clRowEl = clCard ? clCard.querySelector('.card-checklist .cl-row') : null;
          if (clRowEl) {
            var txt = clRowEl.querySelector('.cl-text');
            if (txt) txt.click();
          }
          var clCard3 = null;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) clCard3 = cards[i];
          }
          var cb3 = clCard3 ? clCard3.querySelector('.card-checklist input[type="checkbox"]') : null;
          ok('T12e row click toggles back on', !!cb3 && cb3.checked === true);

          // T6: search (non-matches are filtered out of the DOM)
          var s = $('search');
          s.value = 'Smoke test card XYZ (renamed)';
          fire(s, 'input');
          var welcomeGone = true, smokeShown = false;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Welcome to your Kanban board') !== -1) welcomeGone = false;
            if (cards[i].textContent.indexOf('Smoke test card') !== -1) smokeShown = true;
          }
          ok('T6 search hides non-matches', welcomeGone);
          ok('T6 search shows match', smokeShown);
          s.value = '';
          fire(s, 'input');
          ok('T6 search cleared', bySelAll('.card').length === 2, bySelAll('.card').length);

          // T7: theme picker + persistence
          var picker = $('theme-picker');
          ok('T7a picker starts closed', picker.hidden === true && $('btn-theme').getAttribute('aria-expanded') === 'false');
          $('btn-theme').click();
          ok('T7b picker opens', picker.hidden === false && $('btn-theme').getAttribute('aria-expanded') === 'true');
          var colBefore = bySel('.column');
          var bpOpt = picker.querySelector('[data-theme-name="blueprint"]');
          if (bpOpt) bpOpt.click();
          var themeSaved = null;
          try { themeSaved = JSON.parse(localStorage.getItem('kanban.board.v1')).theme; } catch (e) { themeSaved = null; }
          ok('T7c theme applies + persists', document.documentElement.getAttribute('data-theme') === 'blueprint' && themeSaved === 'blueprint', themeSaved);
          ok('T7c2 theme pick does not rebuild board DOM', bySel('.column') === colBefore);
          $('btn-theme').click(); // reopen
          var activeOpt = picker.querySelector('.theme-option.active');
          ok('T7d active option marked', !!activeOpt && activeOpt.getAttribute('data-theme-name') === 'blueprint');
          var claudeOpt = picker.querySelector('[data-theme-name="claude"]');
          if (claudeOpt) claudeOpt.click();
          ok('T7e switch again + closed', document.documentElement.getAttribute('data-theme') === 'claude' && picker.hidden === true);

          // T7f: every registered theme applies + persists, board DOM untouched across the cycle
          var allThemes = window.KanbanState.THEMES;
          ok('T7f seven themes registered', allThemes.length === 7, String(allThemes.length));
          for (var ti = 0; ti < allThemes.length; ti++) {
            $('btn-theme').click(); // reopen picker each iteration
            var themeOpt = picker.querySelector('[data-theme-name="' + allThemes[ti] + '"]');
            ok('T7f option present: ' + allThemes[ti], !!themeOpt);
            if (themeOpt) themeOpt.click();
            var savedTheme2 = null;
            try { savedTheme2 = JSON.parse(localStorage.getItem('kanban.board.v1')).theme; } catch (e) {}
            ok('T7f applies+persists: ' + allThemes[ti], document.documentElement.getAttribute('data-theme') === allThemes[ti] && savedTheme2 === allThemes[ti], String(savedTheme2));
          }
          ok('T7f board DOM stable across theme cycle', bySel('.column') === colBefore);

          // T8: collapse / expand
          var smokeList = columnWithTitle('Smoke list');
          if (smokeList) {
            smokeList.querySelector('[data-action="collapse"]').click();
            ok('T8 column collapsed', !!columnWithTitle('Smoke list') && columnWithTitle('Smoke list').classList.contains('collapsed'));
            smokeList = columnWithTitle('Smoke list');
            if (smokeList) smokeList.querySelector('[data-action="collapse"]').click();
            smokeList = columnWithTitle('Smoke list');
            ok('T8 column re-expanded', smokeList && !smokeList.classList.contains('collapsed'));
          } else {
            ok('T8 column collapsed', false, 'smoke list not found');
            ok('T8 column re-expanded', false, 'smoke list not found');
          }

          // T9: delete + undo via toast
          var countBefore = columnCards(bySelAll('.column')[0]).length;
          var target = null;
          cards = bySelAll('.card');
          for (i = 0; i < cards.length; i++) {
            if (cards[i].textContent.indexOf('Smoke test card XYZ (renamed)') !== -1) target = cards[i];
          }
          if (target) {
            target.click();
            $('cm-delete').click();
            ok('T9 confirm shown', !$('confirm-modal').hidden);
            $('confirm-yes').click();
            ok('T9 card deleted', columnCards(bySelAll('.column')[0]).length === countBefore - 1, columnCards(bySelAll('.column')[0]).length);
            ok('T9 toast with undo', !$('toast').hidden && !$('toast-action').hidden && $('toast-action').textContent === 'Undo');
            $('toast-action').click();
            ok('T9 card restored by undo', columnCards(bySelAll('.column')[0]).length === countBefore, columnCards(bySelAll('.column')[0]).length);
          } else {
            ok('T9 card deleted', false, 'card not found');
          }

          // T10: rename board + persistence
          var bn = $('board-name');
          bn.value = 'Renamed Board';
          fire(bn, 'input');
          var saved = null;
          try { saved = JSON.parse(localStorage.getItem('kanban.board.v1')); } catch (e) { saved = null; }
          ok('T10 board name saved', !!(saved && saved.name === 'Renamed Board'), saved && saved.name);
          ok('T10 4 columns saved', !!(saved && saved.columns.length === 4), saved && saved.columns.length);
          var renamedSaved = false;
          if (saved) {
            for (i = 0; i < saved.columns.length; i++) {
              var cs = saved.columns[i].cards || [];
              for (var j = 0; j < cs.length; j++) {
                if (saved.cards[cs[j]] && saved.cards[cs[j]].title.indexOf('Smoke test card XYZ (renamed)') !== -1) renamedSaved = true;
              }
            }
          }
          ok('T10 edited card saved', renamedSaved);

          // T13: board-file fallback (only in browsers without the File System Access API)
          if (typeof window.showSaveFilePicker !== 'function') {
            ok('T13a fallback input present', !!$('board-file-input'));
            var loader = window.Kanban && window.Kanban._loadBoardFileFallback;
            ok('T13b fallback loader exposed', typeof loader === 'function');
            if (typeof loader === 'function') {
              var otherBoard = JSON.parse(JSON.stringify(window.Kanban.board));
              otherBoard.name = 'From File';
              var fbFile = new File([JSON.stringify(otherBoard)], 'from-file.json', { type: 'application/json' });
              loader(fbFile);
              await new Promise(function (r) { setTimeout(r, 50); }); // FileReader is async
              ok('T13c conflict dialog shown', !$('confirm-modal').hidden);
              $('confirm-yes').click();
              ok('T13d board loaded from file', window.Kanban.board.name === 'From File');
              ok('T13e readonly status set', window.Kanban.fileStatus === 'readonly' && window.Kanban.fileName === 'from-file.json', window.Kanban.fileStatus);
            }
          }

          // T14: startup auto-restore from the backup file — loads without prompting
          var restored = JSON.parse(JSON.stringify(window.Kanban.board));
          restored.name = 'Restored Board';
          window.showSaveFilePicker = function () { return Promise.reject(new Error('stub')); }; // fileSupported() gate
          var t14Handle = makeFakeHandle(restored);
          installFakeIDB({ 'kanban.filehandle.v1': t14Handle });
          ok('T14a restore hook exposed', typeof window.Kanban._restoreBoardFile === 'function');
          if (typeof window.Kanban._restoreBoardFile === 'function') {
            window.Kanban._restoreBoardFile();
            await new Promise(function (r) { setTimeout(r, 80); }); // idb + file reads are async
            ok('T14b board restored from backup', !!(window.Kanban.board && window.Kanban.board.name === 'Restored Board'), window.Kanban.board && window.Kanban.board.name);
            ok('T14c no confirm prompt shown', $('confirm-modal').hidden);
            var savedAfter = null;
            try { savedAfter = JSON.parse(localStorage.getItem('kanban.board.v1')); } catch (e) {}
            ok('T14d localStorage synced to backup', !!(savedAfter && savedAfter.name === 'Restored Board'), savedAfter && savedAfter.name);
            ok('T14e file status connected', window.Kanban.fileStatus === 'ok', window.Kanban.fileStatus);
          }

          // T15: close-time backup — pagehide flushes the current board to the connected file, once
          window.dispatchEvent(new Event('pagehide'));
          await new Promise(function (r) { setTimeout(r, 30); });
          ok('T15a pagehide wrote backup', t14Handle.writes.length === 1, String(t14Handle.writes.length));
          var flushed = null;
          try { flushed = JSON.parse(t14Handle.writes[0]); } catch (e) {}
          ok('T15b backup matches current board', !!(flushed && flushed.name === 'Restored Board'), flushed && flushed.name);
          window.dispatchEvent(new Event('beforeunload'));
          await new Promise(function (r) { setTimeout(r, 30); });
          ok('T15c no duplicate write on beforeunload', t14Handle.writes.length === 1, String(t14Handle.writes.length));

          // T11: no runtime errors
          ok('T11 no JS errors', window.__errors.length === 0, window.__errors.join('; '));
        } catch (err) {
          ok('UNCAUGHT', false, String(err && err.stack || err));
        }

        $('report').textContent = 'SMOKE REPORT\n' + results.join('\n') + '\n' +
          (results.some(function (r) { return r.indexOf('FAIL') === 0; }) ? 'RESULT: FAIL' : 'RESULT: OK');
        document.title = results.some(function (r) { return r.indexOf('FAIL') === 0; }) ? 'SMOKE-FAIL' : 'SMOKE-OK';
      }

      if (document.readyState === 'complete') setTimeout(run, 30);
      else window.addEventListener('load', function () { setTimeout(run, 30); });
    })();
  </script>
